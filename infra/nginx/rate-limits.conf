# Install in /etc/nginx/conf.d/bounded-ops-rate-limits.conf (http context).

limit_req_zone $binary_remote_addr zone=bounded_ops_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=bounded_ops_compute:10m rate=4r/s;
limit_conn_zone $binary_remote_addr zone=bounded_ops_connections:10m;

# `$uri` omits query strings so user parameters never reach disk logs.
log_format bounded_ops_timed escape=json
  '{"time":"$time_iso8601",'
  '"request_id":"$request_id",'
  '"remote_addr":"$remote_addr",'
  '"method":"$request_method",'
  '"uri":"$uri",'
  '"status":$status,'
  '"bytes":$body_bytes_sent,'
  '"request_time":$request_time,'
  '"upstream_time":"$upstream_response_time",'
  '"connection_requests":$connection_requests,'
  '"protocol":"$server_protocol",'
  '"user_agent":"$http_user_agent"}';
