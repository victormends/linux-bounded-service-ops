name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -e .

      - name: Run secret scanner across tree and git history
        run: python -m bounded_ops.ops.secret_scanner --git-history

      - name: Run test suite
        run: pytest -v

      - name: Run singleflight burst benchmark
        run: python scripts/benchmark_singleflight.py

      - name: Smoke test synthetic telemetry aggregator
        run: |
          mkdir -p /tmp/bounded-ops-smoke
          python scripts/generate_synthetic_logs.py --output /tmp/bounded-ops-smoke/access.log --count 250 --hours 2
          python -m bounded_ops.telemetry.collector --log-dir /tmp/bounded-ops-smoke --output /tmp/bounded-ops-smoke/report.json
          test -s /tmp/bounded-ops-smoke/report.json
