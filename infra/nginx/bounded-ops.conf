# Install in /etc/nginx/sites-available/bounded-ops.conf.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    access_log off;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name service.example.invalid;
    access_log /var/log/nginx/bounded-ops-access.log bounded_ops_timed buffer=64k flush=5s;
    return 301 https://service.example.invalid$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name service.example.invalid;
    access_log /var/log/nginx/bounded-ops-access.log bounded_ops_timed buffer=64k flush=5s;

    root /opt/bounded-ops/current/public;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 64k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    reset_timedout_connection on;
    keepalive_timeout 20s;
    limit_conn_status 429;
    limit_req_status 429;
    sendfile on;
    tcp_nopush on;

    ssl_certificate /etc/letsencrypt/live/service.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/service.example.invalid/privkey.pem;

    include /etc/nginx/snippets/bounded-ops-security-headers.conf;

    location ~ /\. { return 404; }
    location ~* \.(?:env|ini|log|sqlite(?:3)?|py|pyc|md|toml|ya?ml|bak|old|orig|swp|pem|key|crt|csr|conf|sh|zip)$ {
        return 404;
    }

    location = /api/v1/compute {
        limit_conn bounded_ops_connections 20;
        limit_req zone=bounded_ops_compute burst=12 nodelay;
        proxy_pass http://127.0.0.1:8765;
        include proxy_params;
        proxy_connect_timeout 3s;
        # Must outlive Python's 90 s job timeout so controlled 504 JSON reaches clients.
        proxy_read_timeout 100s;
    }

    location = /api/v1/stream {
        limit_conn bounded_ops_connections 10;
        limit_req zone=bounded_ops_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8765;
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 3600s;
    }

    location ^~ /api/v1/ {
        limit_conn bounded_ops_connections 20;
        limit_req zone=bounded_ops_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8765;
        include proxy_params;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ =404;
    }
}
